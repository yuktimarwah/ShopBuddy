<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Compare Products | ShopBuddy</title>

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/compare.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/navbar.css">

</head>

<body>

    <header>
        <div id="navbar"></div>
    </header>

    <div class="compare-overlay" id="compare-overlay">
        <div class="compare-dialog">

            <div class="compare-header">
                <h2>Compare Products</h2>

                <button class="close-compare" id="close-compare">
                    &times;
                </button>
            </div>

            <div class="compare-products">

                <div class="compare-slot">
                    <label>Product 1</label>

                    <input type="text" id="compare-product-1" placeholder="Search for a product...">

                    <div class="compare-suggestions" id="suggestions-1">
                    </div>
                </div>

                <div class="compare-slot">
                    <label>Product 2</label>

                    <input type="text" id="compare-product-2" placeholder="Search for a product...">

                    <div class="compare-suggestions" id="suggestions-2">
                    </div>
                </div>

            </div>

            <button class="compare-submit" id="compare-submit">
                Compare
            </button>

        </div>
    </div>

    <main>

        <section class="comparison-section">

            <h1>Compare Products</h1>

            <div id="comparison-container">

            </div>

        </section>

    </main>


    <script src="../js/data.js"></script>
    <script src="../js/compare-page.js"></script>
    <script src="../js/cart.js"></script>

    <script>
        window.comparePagePath = "compare.html";
    </script>

    <script src="../js/compare.js"></script>
    <script src="../js/navbar.js"></script>

</body>

</html>
