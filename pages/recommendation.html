<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find What Fits You | ShopBuddy</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/recommendation.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="stylesheet" href="../css/navbar.css">

</head>

<body>

       <header>
    <div id="navbar"></div>
</header>

<div class="compare-overlay" id="compare-overlay">

    <div class="compare-dialog">

        <div class="compare-header">
            <h2>Compare Products</h2>

            <button class="close-compare" id="close-compare">
                &times;
            </button>
        </div>

        <div class="compare-products">

            <div class="compare-slot">
                <label>Product 1</label>

                <input
                    type="text"
                    id="compare-product-1"
                    placeholder="Search for a product..."
                >

                <div
                    class="compare-suggestions"
                    id="suggestions-1">
                </div>
            </div>

            <div class="compare-slot">
                <label>Product 2</label>

                <input
                    type="text"
                    id="compare-product-2"
                    placeholder="Search for a product..."
                >

                <div
                    class="compare-suggestions"
                    id="suggestions-2">
                </div>
            </div>

        </div>

        <button class="compare-submit" id="compare-submit">
            Compare
        </button>

    </div>

</div>

    <main class="recommendation-page">

        <section class="recommendation-header">

            <h1>Find What Fits You</h1>

            <p>
                Tell us what you need and we'll help you find
                products that match your requirements.
            </p>

        </section>


        <section class="recommendation-form">

            <label for="category">
                What are you looking for?
            </label>

            <select id="category">
                <option value="">Select a category</option>
                <option value="Mobile">Mobile</option>
                
                <option value="Air Conditioner">Air Conditioner</option>
                <option value="Tablet">Tablet</option>
<option value="Smart Watch">Smart Watch</option>
<option value="Refrigerator">Refrigerator</option>
<option value="Washing Machine">Washing Machine</option>
<option value="Microwave">Microwave</option>
            </select>

            <div id="category-fields"></div>

            <button id="recommend-button">
                Find My Match
            </button>

        </section>

        <section id="recommendation-results" class="recommendation-results">

</section>
    </main>


    


    <script src="../js/data.js"></script>
    <script src="../js/recommendation.js"></script>
    <script src="../js/cart.js"></script>
    <script src="../js/compare.js"></script>
    <script src="../js/navbar.js"></script>

</body>

</html>
