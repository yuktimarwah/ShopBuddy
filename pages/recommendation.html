<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find What Fits You | ShopBuddy</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/recommendation.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

       <nav class="navbar">

        <div class="logo">
            <h2>
                <span class="shop">Shop</span><span class="buddy">Buddy</span>
            </h2>
            <p>By Marwah Communications</p>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search for products...">
            <button class="search-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div class="nav-icons">

            <div class="icon-item">
                <i class="fa-regular fa-heart"></i>
                <span>Wishlist</span>
            </div>

            <div class="icon-item" id="compare-nav">
                <i class="fa-solid fa-code-compare"></i>
                <span>Compare</span>
            </div>

            <div class="icon-item">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count">Cart (0)</span>
            </div>

            <div class="icon-item">
                <i class="fa-regular fa-user"></i>
                <span>Account</span>
            </div>

        </div>

    </nav>


    <main class="recommendation-page">

        <section class="recommendation-header">

            <h1>Find What Fits You</h1>

            <p>
                Tell us what you need and we'll help you find
                products that match your requirements.
            </p>

        </section>


        <section class="recommendation-form">

            <label for="category">
                What are you looking for?
            </label>

            <select id="category">
                <option value="">Select a category</option>
                <option value="Mobile">Mobile</option>
                
                <option value="Air Conditioner">Air Conditioner</option>
                <option value="Tablet">Tablet</option>
<option value="Smart Watch">Smart Watch</option>
<option value="Refrigerator">Refrigerator</option>
<option value="Washing Machine">Washing Machine</option>
<option value="Microwave">Microwave</option>
            </select>

            <div id="category-fields"></div>

            <button id="recommend-button">
                Find My Match
            </button>

        </section>

        <section id="recommendation-results" class="recommendation-results">

</section>
    </main>


    


    <script src="../js/data.js"></script>
    <script src="../js/recommendation.js"></script>
    <script src="../js/cart.js"></script>
    
</body>

</html>
