<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | ShopBuddy</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/product-details.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<div class="compare-overlay" id="compare-overlay">

    <div class="compare-dialog">

        <div class="compare-header">
            <h2>Compare Products</h2>
            <button class="close-compare" id="close-compare">
                &times;
            </button>
        </div>

        <div class="compare-products">

            <div class="compare-slot">
    <label>Product 1</label>

    <input 
        type="text" 
        id="compare-product-1"
        placeholder="Search for a product..."
    >

    <div class="compare-suggestions" id="suggestions-1"></div>
</div>

            <div class="compare-slot">
    <label>Product 2</label>

    <input 
        type="text" 
        id="compare-product-2"
        placeholder="Search for a product..."
    >

    <div class="compare-suggestions" id="suggestions-2"></div>
</div>

        </div>

        <button class="compare-submit" id="compare-submit">
            Compare
        </button>

    </div>

</div>

<body>
    <header>
    <nav class="navbar">

        <div class="logo">
            <h2>
                <span class="shop">Shop</span><span class="buddy">Buddy</span>
            </h2>
            <p>By Marwah Communications</p>
        </div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search for products...">
            <button class="search-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div class="nav-icons">

            <div class="icon-item">
                <i class="fa-regular fa-heart"></i>
                <span>Wishlist</span>
            </div>

            <div class="icon-item" id="compare-nav">
                <i class="fa-solid fa-code-compare"></i>
                <span>Compare</span>
            </div>

            <div class="icon-item">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count">Cart (0)</span>
            </div>

            <div class="icon-item">
                <i class="fa-regular fa-user"></i>
                <span>Account</span>
            </div>

        </div>

    </nav>
</header>

    <h1>Product Details</h1>

    <div class="product-details">

    </div>

    <script src="../js/data.js"></script>
    <script src="../js/product-details.js"></script>
    <script src="../js/cart.js"></script>
    <script>
    window.comparePagePath = "compare.html";
</script>
    <script src="../js/compare.js"></script>

</body>

</html>
