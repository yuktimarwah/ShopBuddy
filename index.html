<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,intial-scale=1.0">
        <title>ShopBuddy</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header>
            <nav class="navbar">
                <div class="logo">
                <h2>🛒 ShopBuddy</h2>
                </div>
                <div class="search-box">
                <input type="text" placeholder="Search for products...">
                </div>
                <div class="nav-icons">
                <button>🤍</button>

            <button>🛒</button>

            <button>👤</button>
            </div>
            </nav>

        </header>
        <main>
            <section class="hero">
              <div class="hero-content">
                <h1>Explore the Latest<br><span>Gadgets & Accessories</span></h1>
                <p>
                    Discover premium electronics for your home and everyday life.
            From smartphones to home appliances, ShopBuddy brings trusted
            products from Marwah Communications.
                </p>
                <div class="hero-buttons">
                    <button class="shop-btn">Shop now</button>
                    <button class="explore-btn">Explore Categories</button>
                </div>
              </div> 
              <div class="hero-image">
                <img src="images/hero.png" alt="Electronics Collection">
              </div>
            </section>
        </main>

    </body>
</html>
